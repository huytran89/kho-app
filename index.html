<!DOCTYPE html> 
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kho Ứng Dụng Android TV - Huy Trần</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      line-height: 1.8;
      margin: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    ul {
      padding: 0;
      margin: 0;
    }

    li {
      list-style-type: none;
      border-bottom: 1px solid #e0e0e0; /* đường kẻ mờ ngăn cách */
      margin: 6px 0;
      padding-bottom: 6px;
    }

    a {
      text-decoration: none; /* bỏ gạch chân */
      color: #0044cc;
      display: block;
      padding: 6px 0;
    }

    a:hover {
      color: #0078ff;
      background: #f5f5f5; /* hiệu ứng hover nhẹ */
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>📦 Kho Ứng Dụng Cho Android TV - Huy Trần</h1>
  <ul id="app-list">
    <li>Đang tải danh sách ứng dụng...</li>
  </ul>

  <script>
    async function fetchAPKList() {
      const repo = "huytran89/kho-app";
      const apiUrl = `https://api.github.com/repos/${repo}/contents/`;

      try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const apkFiles = files.filter(file => file.name.endsWith(".apk"));
        const list = document.getElementById("app-list");
        list.innerHTML = "";

        apkFiles.forEach(file => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = file.download_url;
          link.textContent = "📥 " + file.name;
          link.download = file.name;
          item.appendChild(link);
          list.appendChild(item);
        });

        if (apkFiles.length === 0) {
          list.innerHTML = "<li>Không có file .apk nào trong kho.</li>";
        }

      } catch (error) {
        document.getElementById("app-list").innerHTML = "<li>Lỗi tải danh sách ứng dụng.</li>";
        console.error(error);
      }
    }

    fetchAPKList();
  </script>
</body>
</html>
